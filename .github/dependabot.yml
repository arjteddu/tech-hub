version: 2
updates:
  # pnpm workspace: Dependabot detects pnpm-workspace.yaml at "/" and
  # updates every app/package's dependencies together.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
