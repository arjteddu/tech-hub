name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techhub
          POSTGRES_PASSWORD: techhub
          POSTGRES_DB: techhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://techhub:techhub@localhost:5432/techhub
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      RAZORPAY_KEY_ID: ci-key
      RAZORPAY_KEY_SECRET: ci-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db generate

      - name: Apply migrations
        run: pnpm --filter db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Non-blocking: a transitive advisory in some deep dependency
      # shouldn't stop every merge, but it should stay visible rather
      # than requiring someone to run this locally to notice it.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
